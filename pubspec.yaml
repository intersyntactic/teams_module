name: is_teams_module
description: >-
  The Teams module for intersyntactic: what people say and press in
  Microsoft Teams, taken in as nodes on a journey path.
version: 0.0.1
repository: https://github.com/intersyntactic/teams_module
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  is_agent_shapes:
    git:
      url: git@github.com:intersyntactic/agent_shapes.git
      ref: bddc4cef70326b8ead79b2ac59d15fb673949006
  is_airlock:
    git:
      url: https://github.com/intersyntactic/airlock.git
      ref: bb4f421dde0dd92a5c7cff9f8d6a56c788da66d0
  is_annotation_shapes:
    git:
      url: git@github.com:intersyntactic/annotation_shapes.git
      ref: 0749035bc332ec4a3071434952a388db1922d643
  is_journal: ^0.2.0
  is_shapes: ^0.3.0
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0

dependency_overrides:
  # Every is_shapes up to 0.3.1 asks for is_content_id ^0.1.0 and is_journal
  # 0.2.0 asks for ^0.2.0. 0.2.0 only adds FileSetId and ListedPath to
  # 0.1.0, so is_shapes runs on it unchanged. Remove once is_shapes widens
  # its range.
  is_content_id: ^0.2.0
  # is_airlock's own override, repeated here because overrides apply only
  # in the root package: is_effects 0.1.0 on pub.dev predates what
  # is_airlock_api 0.2.0 needs.
  is_effects:
    git:
      url: https://github.com/intersyntactic/effects.git
      ref: c6c50439eb5401fecb462ce55dc538942712b28c
