name: is_teams_module
description: >-
  The Teams module for intersyntactic: what people say and press in
  Microsoft Teams, taken in as nodes on a journey path.
version: 0.0.1
repository: https://github.com/intersyntactic/teams_module
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  is_annotation_shapes: ^0.2.0
  is_conversation_shapes: ^0.4.0
  is_docking_port:
    git:
      url: https://github.com/intersyntactic/docking_port.git
      ref: 0d1ea83
  is_shapes: ^0.4.0
  pointycastle: ^4.0.0

# Until is_annotation_shapes 0.2.1 is published: is_docking_port takes it
# by git, and pub won't take one package from two sources.
dependency_overrides:
  is_annotation_shapes:
    git:
      url: https://github.com/intersyntactic/annotation_shapes.git
      ref: 56a58d89b009e6def38390193c5f6ba61881420b

dev_dependencies:
  is_journal: ^0.5.0
  lints: ^6.1.0
  test: ^1.33.0
