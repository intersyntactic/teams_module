name: is_teams_module
description: >-
  The Teams module for intersyntactic: what people say and press in
  Microsoft Teams, taken in as nodes on a trajectory.
version: 0.0.1
repository: https://github.com/intersyntactic/teams_module
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  is_annotation_shapes: ^0.3.0
  is_conversation_shapes: ^0.8.0
  is_docking_station:
    git:
      url: https://github.com/intersyntactic/docking_station.git
      ref: a3672b0702df34cae61c00f76345facf7fca519e
  is_effects: ^0.7.0
  is_shapes: ^0.4.0
  pointycastle: ^4.0.0

dev_dependencies:
  is_journal: ^0.9.0
  lints: ^6.1.0
  test: ^1.33.0

# Until is_effects 0.7.0 is on pub.dev; then delete this block.
dependency_overrides:
  is_effects:
    git:
      url: https://github.com/intersyntactic/effects.git
      ref: b313ac87188fb553b9a07ad31407dc1de9c4a610
