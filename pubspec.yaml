  is_annotation_shapes: ^0.5.0
  is_conversation_vocabulary: ^0.2.0
  is_docking_station_api: ^0.10.0
  is_effects: ^0.19.0
  is_model_vocabulary: ^0.4.0
  is_relay: ^0.7.0
  is_shapes: ^0.6.0
  is_sign_in_vocabulary: ^0.1.0
  is_web_address_vocabulary: ^0.1.2
  pointycastle: ^4.0.0

dev_dependencies:
  is_content_id: ^0.2.0
  lints: ^6.1.0
  test: ^1.33.0

executables:
  teams-reply-drawing: teams_reply_drawing
