name: is_teams_module
description: >-
  The Teams module for intersyntactic: Peter's replies, approvals and
  corrections from Microsoft Teams, taken in as nodes on a journey path.
version: 0.0.1
repository: https://github.com/intersyntactic/teams_module
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  is_annotation_shapes: ^0.1.0
  is_shapes: ^0.3.0
  intersyntactic_protocol:
    git:
      url: git@github.com:enspyrco/intersyntactic.git
      path: packages/intersyntactic_protocol
      ref: dc3fc90c92998c103939fe13779f7f5df14e1431
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0

# The protocol's own dependencies are packages of intersyntactic's workspace,
# each asked for as `any`. Outside the workspace `any` means pub.dev, where
# `executor` is another publisher's package (agilord.com), so every one is
# named here, from the same commit as the protocol.
dependency_overrides:
  anthropic_client:
    git:
      url: git@github.com:enspyrco/intersyntactic.git
      path: packages/anthropic_client
      ref: dc3fc90c92998c103939fe13779f7f5df14e1431
  executor:
    git:
      url: git@github.com:enspyrco/intersyntactic.git
      path: packages/executor
      ref: dc3fc90c92998c103939fe13779f7f5df14e1431
  path_confinement:
    git:
      url: git@github.com:enspyrco/intersyntactic.git
      path: packages/path_confinement
      ref: dc3fc90c92998c103939fe13779f7f5df14e1431
