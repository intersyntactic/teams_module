name: is_teams_module
description: >-
  The Teams module for intersyntactic: what people say and press in
  Microsoft Teams, taken in as nodes on a trajectory.
version: 0.0.6
repository: https://github.com/intersyntactic/teams_module
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  is_annotation_shapes: ^0.3.2
  is_conversation_shapes: ^0.8.3
  is_docking_station_api: ^0.4.0
  is_effects: ^0.14.2
  is_shapes: ^0.6.0
  pointycastle: ^4.0.0

dev_dependencies:
  is_content_id: ^0.2.0
  lints: ^6.1.0
  test: ^1.33.0

executables:
  teams-reply-translator: teams_reply_translator
