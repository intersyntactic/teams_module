name: teams_reply
description: >-
  teams-reply, the renderer that draws a Teams reply's body from recorded
  entries: a pure function in lib/, named by the shasum of its files, and
  the follower it is built into in bin/.
version: 0.0.1
repository: https://github.com/intersyntactic/teams_module
publish_to: none

environment:
  sdk: ^3.13.0

# For bin/ only: lib/ imports nothing but the SDK (test/pure_test.dart).
dependencies:
  render_follower:
    path: ../render_follower

dev_dependencies:
  analyzer: ^14.7.0
  lints: ^6.1.0
  test: ^1.33.0
