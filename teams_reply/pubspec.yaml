name: teams_reply
description: >-
  The teams-reply program: the render runner, built with is_teams_reply as its
  renderer, and that renderer's id compiled in.
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  # Exactly one version: its archive's sha256 in pubspec.lock is the
  # renderer's id (`dart run render_runner:renderer_id is_teams_reply`).
  is_teams_reply: 0.1.0
  render_runner:
    path: ../render_runner

dev_dependencies:
  lints: ^6.1.0
